services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://adfa:adfa@db:5432/adfa
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adfa
      POSTGRES_USER: adfa
      POSTGRES_PASSWORD: adfa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adfa -d adfa"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
